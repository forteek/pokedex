[project]
name = "pokedex"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "opencv-python-headless>=4.10",
    "pygame>=2.6.1",
]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project.scripts]
pokedex = "pokedex.app:run"

[tool.uv]
package = true

[tool.setuptools.package-data]
pokedex = [
    "pokemon.db",
    "assets/png/*.png",
    "assets/png/backgrounds/*.png",
    "assets/png/pokemon/*.png",
    "assets/svg/*.svg",
    "assets/mp3/names/*.mp3",
    "assets/mp3/types/*.mp3",
    "assets/mp3/flavor/*.mp3",
]
